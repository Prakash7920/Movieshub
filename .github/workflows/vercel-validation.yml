name: Vercel build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Type check
        run: npm run typecheck
      - name: Build Next.js application
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movieshub
          NEXTAUTH_SECRET: ci-only-secret-value-with-more-than-32-characters
          NEXTAUTH_URL: https://example.vercel.app
          NEXT_PUBLIC_APP_URL: https://example.vercel.app
          DEMO_MODE: "false"
        run: npm run build
