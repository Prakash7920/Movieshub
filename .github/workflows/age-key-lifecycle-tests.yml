name: AGE Recovery Key Lifecycle Tests

on:
  pull_request:
    paths:
      - "scripts/backup/**"
      - "docs/backup/age-recovery-key-runbook.md"
      - ".github/workflows/age-key-lifecycle-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  age-key-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install AGE
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Run isolated recovery and rotation tests
        run: bash scripts/backup/test-age-key-lifecycle.sh
