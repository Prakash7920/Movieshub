name: Historical Secret Scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan complete Git history for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Run full-history Gitleaks scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$HOME/go/bin/gitleaks" git . --redact --verbose --exit-code 2
